<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Renda</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="fundo-estrelas">
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>
    </div>
    <div id="header-placeholder"></div>
    <main class="container">
        <h1>Cadastrar Renda</h1>

        <form id="formRenda">
            <label for="userId">Id do Usuario(temporario): </label>
            <input type="number" id="userId" placeholder="Ex: 1" required>
            
            <label for="valor">Valor: </label>
            <input type="number" id="valor" step="0.01" placeholder="Ex: 3000.0" required>

            <label for="dataHora">Data e Hora: </label>
            <input type="datetime-local" id="dataHoraInput" required>
            <button type="button" id="dataAtual">Usar Data/Hora Atual</button>

            <button type="submit">Cadastrar Renda</button>
        </form>
        <div id="resultado"></div>
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
